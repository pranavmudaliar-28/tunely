# Tunely on one server: everything below, always on, restarted after crashes and reboots.
#   cp deploy/.env.example deploy/.env   (fill it in)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Distinct from the dev compose project ("tunely") so the two never share containers or volumes.
name: tunely-prod

x-db-url: &db-url postgres://tunely:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tunely

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tunely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tunely
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tunely']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction; appendonly keeps queued jobs across restarts.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  # One-shot: applies database migrations, then exits. api and worker start after it succeeds.
  migrate:
    image: tunely-api
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ['node', 'apps/api/dist/migrate.js']
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: tunely-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      REPORT_HASH_SECRET: ${REPORT_HASH_SECRET:?set REPORT_HASH_SECRET}
      CORS_ORIGINS: https://${DOMAIN}
      TRUST_PROXY: 'true' # behind Caddy
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?set DOMAIN}
        # Same origin: Caddy sends /v1/* to the API, so the browser needs no CORS.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT: ${NEXT_PUBLIC_ADSENSE_SLOT:-}
    restart: unless-stopped
    environment:
      # Server-side rendering talks to the API directly on the private network.
      API_URL: http://api:4000
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # HTTPS certificates
      - caddy_config:/config
    depends_on: [web, api]

  # Nightly database dump, keeping the last 7 days in the "backups" volume.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [backups:/backups]
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h postgres -U tunely -Fc tunely > /backups/tunely-$$(date +%F).dump && echo "backup ok"
          find /backups -name 'tunely-*.dump' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  backups:
