services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tunely
      POSTGRES_PASSWORD: tunely
      POSTGRES_DB: tunely
    ports: ['${POSTGRES_PORT:-5433}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tunely']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  pgdata:
  redisdata:
